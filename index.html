<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Помидорки</title>
  <meta name="description" content="Таймер Помодоро для детей с СДВГ и аутизмом">
  <meta name="theme-color" content="#FFF8EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Помидорки">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/unbounded-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="motion-full">
  <div id="app">
    <main id="main">

      <!-- Выбор помидорки -->
      <section id="screen-home" class="screen" hidden>
        <header class="home-head">
          <h1 class="deco" data-i18n="homeTitle">Привет!</h1>
          <p class="lead" data-i18n="homeSubtitle"></p>
        </header>
        <div class="mode-grid" id="mode-grid"></div>
        <p class="today" id="today"></p>
        <button class="btn btn-primary btn-xl" id="btn-start" type="button">
          <span data-i18n="start">Начать!</span>
        </button>
      </section>

      <!-- Идёт таймер -->
      <section id="screen-session" class="screen" hidden>
        <header class="session-top">
          <button class="icon-btn" id="btn-exit" type="button" data-i18n-label="exit"></button>
          <div class="session-title">
            <div class="mode-name" id="session-mode"></div>
            <div class="cycle-dots" id="cycle-dots" aria-hidden="true"></div>
          </div>
          <div class="tomato-count" id="tomato-count"></div>
        </header>

        <div class="session-body">
          <div class="stage" id="stage">
            <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
              <circle class="ring-bg" cx="100" cy="100" r="90"/>
              <circle class="ring-fg" id="ring-fg" cx="100" cy="100" r="90"/>
            </svg>
            <div class="char" id="char">
              <img class="char-img" alt="" draggable="false">
              <img class="char-img" alt="" draggable="false">
            </div>
            <div class="notes" id="notes" aria-hidden="true"></div>
          </div>

          <div class="session-info">
            <div class="phase" id="phase"></div>
            <div class="time" id="time" role="timer" aria-live="off">00:00</div>

            <div class="controls" id="controls">
              <button class="btn btn-soft" id="btn-pause" type="button"></button>
              <button class="btn btn-soft" id="btn-sound" type="button"></button>
            </div>

            <div class="await-panel" id="await-panel" hidden>
              <button class="btn btn-green btn-xxl" id="btn-ready" type="button">
                <span data-i18n="readyToRest">Готов отдохнуть?</span>
              </button>
              <p class="hint" data-i18n="readyHint"></p>
            </div>
          </div>
        </div>

        <div class="done-bar">
          <button class="btn btn-done" id="btn-done" type="button">
            <span data-i18n="done">Готово!</span>
          </button>
        </div>

        <!-- Отсчёт 10…0 -->
        <div class="countdown" id="countdown" hidden>
          <div class="countdown-card">
            <div class="countdown-num" id="countdown-num">10</div>
            <div class="countdown-text deco" data-i18n="backToWork">А теперь за работу!</div>
            <button class="btn btn-soft" id="btn-more" type="button"></button>
          </div>
        </div>
      </section>

      <!-- Награда -->
      <section id="screen-reward" class="screen screen-reward" hidden>
        <div class="confetti" id="confetti" aria-hidden="true"></div>
        <div class="reward-hooray deco" data-i18n="rewardHooray">Ура!</div>
        <div class="reward-char" id="reward-char"><img alt="" draggable="false"></div>
        <div class="reward-card">
          <div class="reward-badge" id="reward-badge"></div>
          <h2 class="reward-title" id="reward-title"></h2>
          <p class="reward-summary" id="reward-summary"></p>
        </div>
        <div class="reward-actions">
          <button class="btn btn-primary btn-lg" id="btn-to-calendar" type="button"><span data-i18n="rewardToCalendar"></span></button>
          <button class="btn btn-soft btn-lg" id="btn-reward-home" type="button"><span data-i18n="rewardHome"></span></button>
        </div>
      </section>

      <!-- Календарь наград -->
      <section id="screen-rewards" class="screen" hidden>
        <h1 class="screen-title" data-i18n="rewardsTitle">Мои награды</h1>
        <div class="stats" id="stats"></div>
        <div class="calendar card">
          <div class="cal-head">
            <button class="icon-btn" id="cal-prev" type="button"></button>
            <div class="cal-month" id="cal-month"></div>
            <button class="icon-btn" id="cal-next" type="button"></button>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
        <div class="legend" id="legend"></div>
      </section>

      <!-- Настройки -->
      <section id="screen-settings" class="screen" hidden>
        <h1 class="screen-title" data-i18n="settingsTitle">Настройки</h1>
        <div id="settings"></div>
      </section>
    </main>

    <nav class="tabbar" id="tabbar">
      <button class="tab" data-tab="timer" type="button"></button>
      <button class="tab" data-tab="rewards" type="button"></button>
      <button class="tab" data-tab="settings" type="button"></button>
    </nav>

    <!-- Подтверждение -->
    <div class="modal" id="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-char" id="modal-char"></div>
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
        <div class="modal-actions">
          <button class="btn btn-primary btn-lg" id="modal-yes" type="button"></button>
          <button class="btn btn-soft btn-lg" id="modal-no" type="button"></button>
        </div>
      </div>
    </div>

    <!-- Быстрый выбор звука -->
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-card">
        <div class="sheet-head">
          <h2 data-i18n="bgSound"></h2>
          <button class="icon-btn" id="sheet-close" type="button"></button>
        </div>
        <div id="sheet-body"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
